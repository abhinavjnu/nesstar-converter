[package]
name = "nesstar-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
description = "High-performance Rust parser and converter for proprietary Nesstar survey files"
keywords = ["nesstar", "ddi", "survey", "parquet", "microdata"]
categories = ["parser-implementations", "data-structures", "science"]

[features]
parquet = ["dep:arrow-array", "dep:arrow-schema", "dep:parquet"]

[dependencies]
csv = { version = "1.4", default-features = false }
quick-xml = "0.37"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
arrow-array = { version = "54", optional = true }
arrow-schema = { version = "54", optional = true }
parquet = { version = "54", default-features = false, features = ["arrow"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
memmap2 = "0.9"

[lints]
workspace = true
