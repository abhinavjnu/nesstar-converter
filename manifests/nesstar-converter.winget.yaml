PackageIdentifier: AbhinavKumar.NesstarConverter
PackageVersion: 1.0.7
PackageName: Nesstar Converter
Publisher: Abhinav Kumar
PublisherUrl: https://github.com/abhinavjnu
Author: Abhinav Kumar
License: MIT
LicenseUrl: https://github.com/abhinavjnu/nesstar-converter/blob/main/LICENSE
ShortDescription: Standalone desktop app and CLI to convert proprietary Nesstar binary survey files to open formats (CSV, Parquet, Stata, Excel).
Description: |
  Nesstar Converter reads proprietary .Nesstar binary survey files directly (without requiring legacy Windows Nesstar Explorer)
  and converts them into modern open formats including Apache Parquet, Stata (.dta), SPSS (.sav), CSV, and Excel.
