name: Build Desktop Apps (Rust)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build macOS App Bundle
        run: |
          chmod +x build_mac_rust_app.sh
          ./build_mac_rust_app.sh

      - name: Create Zip
        run: |
          cd dist
          zip -9 -r "../NesstarConverter-macOS-Rust.zip" "Nesstar Converter.app"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: NesstarConverter-macOS
          path: NesstarConverter-macOS-Rust.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libgtk-3-dev \
            libasound2-dev

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build Linux executable
        run: cargo build --release --bin nesstar-gui

      - name: Package Linux executable
        run: |
          mkdir -p dist
          cp target/release/nesstar-gui dist/NesstarConverter
          cd dist
          tar cf "NesstarConverter-Linux-x86_64-Rust.tar" NesstarConverter
          gzip -9 "NesstarConverter-Linux-x86_64-Rust.tar"
          mv NesstarConverter-Linux-x86_64-Rust.tar.gz ../

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: NesstarConverter-Linux
          path: NesstarConverter-Linux-x86_64-Rust.tar.gz

  release:
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: NesstarConverter-macOS

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: NesstarConverter-Linux

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            NesstarConverter-macOS-Rust.zip
            NesstarConverter-Linux-x86_64-Rust.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
