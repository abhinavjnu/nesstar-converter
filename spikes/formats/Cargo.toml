[package]
name = "nesstar-format-spike"
version = "0.1.0"
edition = "2021"
publish = false

# This is deliberately an isolated manifest. WP-P0 owns the root workspace.

[features]
default = ["csv", "parquet", "excel"]
csv = ["dep:csv"]
parquet = ["dep:arrow-array", "dep:arrow-schema", "dep:parquet"]
excel = ["dep:rust_xlsxwriter"]
# No Rust DTA writer is approved yet; this feature exits with an actionable error.
stata = []
all = ["csv", "parquet", "excel", "stata"]

[dependencies]
csv = { version = "1.3.1", default-features = false, optional = true }
arrow-array = { version = "53.3.0", default-features = false, optional = true }
arrow-schema = { version = "53.3.0", default-features = false, optional = true }
parquet = { version = "53.3.0", default-features = false, features = ["arrow", "snap"], optional = true }
rust_xlsxwriter = { version = "0.79.4", default-features = false, optional = true }
