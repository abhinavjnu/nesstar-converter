[package]
name = "nesstar-gui-spike-wgpu"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# The only renderer difference from the glow spike is this eframe feature.
eframe = { version = "=0.33.0", default-features = false, features = ["accesskit", "default_fonts", "wgpu"] }
egui = { version = "=0.33.0", default-features = false, features = ["accesskit", "default_fonts"] }
# eframe's wgpu feature leaves platform backends disabled when defaults are off.
# Enable only the macOS and Linux backends needed by this spike.
wgpu = { version = "=27.0.1", default-features = false, features = ["metal", "vulkan"] }
rfd = { version = "=0.15.4", default-features = false, features = ["xdg-portal"] }
